<template>
    <lightning-card title="Mass Text — Class Member Clients" icon-name="standard:sms">
        <lightning-button-icon
            slot="actions"
            icon-name="utility:refresh"
            variant="border-filled"
            alternative-text="Refresh"
            onclick={handleRefreshAll}>
        </lightning-button-icon>

        <!-- Compose -->
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <lightning-input-rich-text
                label="Message"
                value={messageBodyHtml}
                onchange={handleMessageChange}>
            </lightning-input-rich-text>
            <div class="slds-grid slds-grid_align-spread slds-m-top_x-small">
                <span class="slds-text-body_small slds-text-color_weak">
                    {characterCount} characters / {segmentCount} segment(s)
                </span>
                <lightning-button
                    label={sendButtonLabel}
                    variant="brand"
                    disabled={isSendDisabled}
                    onclick={openConfirm}>
                </lightning-button>
            </div>
        </div>

        <!-- Recipients -->
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <div class="slds-text-heading_small slds-m-bottom_x-small">
                Class Member Clients ({recipients.length})
            </div>

            <template if:true={recipientsError}>
                <p class="slds-text-color_error">Error loading recipients: {recipientsError}</p>
            </template>

            <template if:true={hasRecipients}>
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col" style="width: 40px;">
                                <lightning-input type="checkbox" variant="label-hidden" label="Select all" checked={isAllSelected} onchange={handleSelectAll}></lightning-input>
                            </th>
                            <th scope="col" class="slds-text-title_caps">Recipient</th>
                            <th scope="col" class="slds-text-title_caps">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={recipients} for:item="r">
                            <tr key={r.contactId} class="slds-hint-parent">
                                <td>
                                    <lightning-input
                                        type="checkbox"
                                        variant="label-hidden"
                                        label={r.name}
                                        checked={r.isSelected}
                                        disabled={r.isOptedOut}
                                        data-contact-id={r.contactId}
                                        onchange={handleRowSelect}>
                                    </lightning-input>
                                </td>
                                <td data-label="Recipient">
                                    <div>{r.name}</div>
                                    <div class="slds-text-body_small slds-text-color_weak">{r.phone}</div>
                                </td>
                                <td data-label="Status">
                                    <template if:true={r.isOptedOut}>
                                        <lightning-badge label="Opted out" class="slds-theme_warning"></lightning-badge>
                                    </template>
                                    <template if:false={r.isOptedOut}>
                                        <template if:true={r.lastSentDate}>
                                            <span class="slds-text-body_small slds-text-color_weak">
                                                Last sent <lightning-formatted-date-time value={r.lastSentDate} year="numeric" month="short" day="numeric"></lightning-formatted-date-time>
                                            </span>
                                        </template>
                                        <template if:false={r.lastSentDate}>
                                            <span class="slds-text-body_small slds-text-color_weak">Not yet contacted</span>
                                        </template>
                                    </template>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>

            <template if:false={hasRecipients}>
                <p class="slds-text-color_weak">No Class Member Client parties found on this matter.</p>
            </template>
        </div>

        <!-- History -->
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <div class="slds-text-heading_small slds-m-bottom_x-small">Send History</div>

            <template if:true={historyError}>
                <p class="slds-text-color_error">Error loading history: {historyError}</p>
            </template>

            <div class="slds-scrollable_x">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered" style="min-width: 900px;">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col" class="slds-text-title_caps">Direction</th>
                            <th scope="col" class="slds-text-title_caps">Contact</th>
                            <th scope="col" class="slds-text-title_caps">Message</th>
                            <th scope="col" class="slds-text-title_caps">Status</th>
                            <th scope="col" class="slds-text-title_caps">Sent</th>
                            <th scope="col" class="slds-text-title_caps">Delivered</th>
                            <th scope="col" class="slds-text-title_caps">Replied</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={history} for:item="h">
                            <tr key={h.id} class="slds-hint-parent">
                                <td>{h.direction}</td>
                                <td>{h.contactName}</td>
                                <td class="touchpoint-message-cell">{h.message}</td>
                                <td>{h.status}</td>
                                <td><lightning-formatted-date-time value={h.sentTime} year="numeric" month="short" day="numeric" hour="2-digit" minute="2-digit"></lightning-formatted-date-time></td>
                                <td><lightning-formatted-date-time value={h.deliveredTime} year="numeric" month="short" day="numeric" hour="2-digit" minute="2-digit"></lightning-formatted-date-time></td>
                                <td>
                                    <template if:true={h.isReplied}>
                                        <lightning-icon icon-name="utility:reply" size="x-small" alternative-text="Replied"></lightning-icon>
                                    </template>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Confirm Send Modal -->
        <template if:true={isConfirmOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeConfirm} title="Close">
                            <lightning-icon icon-name="utility:close" size="small" alternative-text="Close"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title">Confirm Send</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-m-bottom_small">
                            This will send a real text message to <strong>{selectedCount}</strong> recipient(s):
                        </p>
                        <ul class="slds-m-bottom_medium confirm-recipient-list">
                            <template for:each={confirmRecipients} for:item="r">
                                <li key={r.contactId}>{r.name} — {r.phone}</li>
                            </template>
                        </ul>
                        <div class="slds-box slds-theme_shade">
                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_xx-small">Message preview (formatting is stripped — SMS is plain text)</p>
                            <p class="confirm-message-preview">{plainMessageBody}</p>
                        </div>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeConfirm} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button label="Send" variant="brand" onclick={handleConfirmSend} disabled={isSending}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </lightning-card>
</template>
