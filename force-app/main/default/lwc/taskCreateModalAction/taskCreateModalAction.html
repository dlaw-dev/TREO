<template>
    <lightning-modal-header label={modalTitle}></lightning-modal-header>

    <lightning-modal-body onclick={handleModalOutsideSearchClick}>

        <template if:false={isEditMode}>
        <div class="modal-tabs" role="tablist">
            <button
                type="button"
                role="tab"
                aria-selected={isNewTaskTab}
                class={newTaskTabClass}
                data-tab="newTask"
                onclick={handleTabClick}>New Task</button>
            <button
                type="button"
                role="tab"
                aria-selected={isUseTemplateTab}
                class={useTemplateTabClass}
                data-tab="useTemplate"
                onclick={handleTabClick}>Use Task Template</button>
        </div>
        </template>

        <template if:true={isNewTaskTab}>
        <template for:each={displayTasks} for:item="t">
        <div key={t._id} class="task-draft-card">
            <div class="task-draft-header">
                <span class="task-draft-index">Task {t.displayIndex}</span>
                <template if:true={t.canRemove}>
                    <button
                        type="button"
                        class="task-draft-remove"
                        data-id={t._id}
                        title="Remove this task"
                        onclick={removeTaskRow}>✕</button>
                </template>
            </div>

            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-3">
                    <!-- Subject -->
                    <div class="search-container" data-id={t.subjectContainerId} onclick={handleSearchAreaClick}>
                        <lightning-input
                            data-id={t._id}
                            data-role="subject-input"
                            label="Subject"
                            required
                            autocomplete="off"
                            value={t.subject}
                            onfocus={handleSubjectFocus}
                            onblur={handleSubjectBlur}
                            onchange={handleSubject}
                            onkeyup={handleSubject}>
                        </lightning-input>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-3">
                    <!-- Selected Assignee -->
                    <template if:true={t.hasSelectedAssignee}>
                        <div class="slds-form-element__label slds-m-bottom_x-small">
                            Assignee <abbr class="slds-required" title="required">*</abbr>
                        </div>

                        <template for:each={t.selectedUsers} for:item="u">
                            <lightning-pill
                                key={u.id}
                                label={u.name}
                                data-row-id={t._id}
                                onremove={removeUser}>
                            </lightning-pill>
                        </template>
                    </template>

                    <!-- Assignee Search -->
                    <template if:false={t.hasSelectedAssignee}>
                        <div class="search-container" data-id={t.assigneeContainerId} onclick={handleSearchAreaClick}>
                            <lightning-input
                                data-id={t._id}
                                type="search"
                                label="Assignee"
                                required
                                value={t.userSearchKeyword}
                                onfocus={handleUserFocus}
                                onclick={handleUserClick}
                                onblur={handleUserBlur}
                                onkeyup={handleUserSearch}
                                onkeydown={handleUserKeydown}>
                            </lightning-input>
                        </div>
                    </template>
                </div>

                <div class="slds-col slds-size_1-of-3">
                    <!-- Due Date -->
                    <lightning-input
                        data-id={t._id}
                        data-role="dueDate"
                        type="date"
                        label="Due Date"
                        required
                        message-when-value-missing="Please select a Due Date."
                        value={t.activityDate}
                        onchange={handleDueDate}>
                    </lightning-input>
                </div>
            </div>

            <!-- More Details -->
            <div class="more-details-section slds-m-top_medium">
                <button
                    type="button"
                    class="more-details-toggle"
                    data-id={t._id}
                    onclick={toggleMoreDetails}
                    aria-expanded={t.isMoreDetailsOpen}>
                    <lightning-icon icon-name={t.moreDetailsIcon} size="xx-small"></lightning-icon>
                    <span>More Details</span>
                </button>

                <template if:true={t.isMoreDetailsOpen}>
                    <div class="more-details-content slds-m-top_small">

                        <!-- Description -->
                        <lightning-textarea
                            data-id={t._id}
                            label="Description"
                            value={t.description}
                            onchange={handleDescription}>
                        </lightning-textarea>

                        <!-- Attachments -->
                        <div class="slds-form-element slds-m-top_medium">
                            <label class="slds-form-element__label">Attachments</label>

                            <template if:true={t.hasExistingAttachments}>
                                <ul class="existing-attach-list">
                                    <template for:each={t.existingAttachments} for:item="a">
                                        <li key={a.contentDocumentId} class="existing-attach-item">
                                            <lightning-icon icon-name="doctype:attachment" size="xx-small"></lightning-icon>
                                            <a href={a.viewUrl} target="_blank" rel="noopener">{a.title}</a>
                                        </li>
                                    </template>
                                </ul>
                            </template>

                            <div class="slds-form-element__control">
                                <div class={t.dropZoneClass}
                                     data-id={t._id}
                                     onclick={handleDropZoneClick}
                                     ondragover={handleDragOver}
                                     ondragleave={handleDragLeave}
                                     ondrop={handleDrop}>
                                    <lightning-icon icon-name="utility:upload" size="small" class="drop-zone__icon"></lightning-icon>
                                    <p class="drop-zone__text">Drag &amp; drop files here</p>
                                    <p class="drop-zone__sub">or <span class="drop-zone__browse">click to browse</span> &nbsp;·&nbsp; max 5 MB per file</p>
                                </div>
                                <input
                                    type="file"
                                    multiple
                                    data-id={t._id}
                                    data-file-input-id={t._id}
                                    class="slds-assistive-text"
                                    onchange={handleFileChange}>
                            </div>

                            <template if:true={t.hasStagedFiles}>
                                <div class="attach-banner slds-m-top_small">
                                    <div class="attach-banner__header">
                                        <lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon>
                                        <span>{t.attachBannerText}</span>
                                    </div>
                                    <ul class="attach-banner__list">
                                        <template for:each={t.stagedFiles} for:item="f">
                                            <li key={f.name} class="attach-banner__item">
                                                <a href={f.previewUrl} target="_blank" rel="noopener" title="View file">{f.name}</a>
                                                <button class="attach-banner__remove" data-id={t._id} data-name={f.name} onclick={handleRemoveStagedFile} title="Remove file">✕</button>
                                            </li>
                                        </template>
                                    </ul>
                                </div>
                            </template>

                            <template if:true={t.fileWarning}>
                                <p class="slds-m-top_x-small slds-text-body_small slds-text-color_error">{t.fileWarning}</p>
                            </template>
                        </div>

                        <!-- Priority / Status -->
                        <div class="priority-status-grid slds-m-top_medium">
                            <lightning-combobox
                                data-id={t._id}
                                label="Priority"
                                value={t.priority}
                                options={priorityOptions}
                                onchange={handlePriority}>
                            </lightning-combobox>

                            <lightning-combobox
                                data-id={t._id}
                                label="Status"
                                value={t.status}
                                options={statusOptions}
                                onchange={handleStatus}>
                            </lightning-combobox>
                        </div>

                        <!-- Waiting On Task -->
                        <template if:true={t.isStatusWaiting}>
                            <div class="slds-m-top_medium">
                                <!--
                                    A subtask-chain step's "Waiting" has nothing to do with
                                    Waiting_On_Task__c - it's blocked on the previous chain step,
                                    not a user-pickable ad hoc dependency. Shown read-only so it's
                                    never confusingly blank, and never editable here.
                                -->
                                <template if:true={t.isChainStep}>
                                    <div class="slds-form-element__label slds-m-bottom_x-small">Waiting On</div>
                                    <div class="waiting-on-pill waiting-on-pill--chain">
                                        <span class="waiting-on-pill-label">{t.chainWaitingLabel}</span>
                                    </div>
                                </template>

                                <template if:false={t.isChainStep}>
                                <template if:true={t.hasWaitingOnTask}>
                                    <div class="slds-form-element__label slds-m-bottom_x-small">Waiting On</div>
                                    <div class="waiting-on-pill">
                                        <span class="waiting-on-pill-label">{t.waitingOnTaskLabel}</span>
                                        <button
                                            type="button"
                                            class="waiting-on-pill-remove"
                                            data-id={t._id}
                                            title="Clear"
                                            onclick={clearWaitingOnTask}>✕</button>
                                    </div>
                                </template>

                                <template if:false={t.hasWaitingOnTask}>
                                    <template if:true={t.hasOtherDraftOptions}>
                                        <div class="waiting-draft-options">
                                            <div class="waiting-draft-options-label">In this batch</div>
                                            <template for:each={t.otherDraftOptions} for:item="opt">
                                                <button
                                                    key={opt._id}
                                                    type="button"
                                                    class="dropdown-item dropdown-item--task"
                                                    data-id={t._id}
                                                    data-draft-id={opt._id}
                                                    onclick={selectWaitingOnDraft}>
                                                    <span class="dropdown-item-title">{opt.title}</span>
                                                    <span class="dropdown-item-meta">{opt.metaLabel}</span>
                                                </button>
                                            </template>
                                        </div>
                                    </template>
                                    <div class="search-container" data-id={t.waitingContainerId} onclick={handleSearchAreaClick}>
                                        <lightning-input
                                            data-id={t._id}
                                            type="search"
                                            label="Waiting On"
                                            required={requireWaitingOnTask}
                                            placeholder="Search tasks on this Matter…"
                                            value={t.waitingSearchKeyword}
                                            onfocus={handleWaitingFocus}
                                            onblur={handleWaitingBlur}
                                            onkeyup={handleWaitingSearch}
                                            onkeydown={handleWaitingKeydown}>
                                        </lightning-input>
                                    </div>
                                </template>
                                </template>
                            </div>
                        </template>

                        <!-- Reviewer (optional) -->
                        <div class="slds-m-top_medium">
                            <template if:true={t.hasReviewFeedback}>
                                <div class="review-feedback-banner slds-m-bottom_x-small">
                                    <span class="review-feedback-banner-label">Sent back for review:</span>
                                    <span>{t.reviewFeedback}</span>
                                </div>
                            </template>

                            <template if:true={t.hasSelectedReviewer}>
                                <div class="slds-form-element__label slds-m-bottom_x-small">Reviewer (optional)</div>
                                <lightning-pill
                                    label={t.selectedReviewer.name}
                                    data-row-id={t._id}
                                    onremove={removeReviewer}>
                                </lightning-pill>
                            </template>

                            <template if:false={t.hasSelectedReviewer}>
                                <div class="search-container" data-id={t.reviewerContainerId} onclick={handleSearchAreaClick}>
                                    <lightning-input
                                        data-id={t._id}
                                        type="search"
                                        label="Reviewer (optional)"
                                        placeholder="Search for a person to review this when it's done…"
                                        value={t.reviewerSearchKeyword}
                                        onfocus={handleReviewerFocus}
                                        onblur={handleReviewerBlur}
                                        onkeyup={handleReviewerSearch}
                                        onkeydown={handleReviewerKeydown}>
                                    </lightning-input>
                                </div>
                            </template>
                        </div>

                        <!-- Reminder Set -->
                        <lightning-input
                            class="slds-m-top_medium"
                            data-id={t._id}
                            type="checkbox"
                            label="Reminder Set"
                            checked={t.isReminderSet}
                            disabled={t.isReminderDisabled}
                            onchange={handleReminderSet}>
                        </lightning-input>

                        <!-- Reminder Picker -->
                        <template if:true={t.isReminderSet}>
                            <div class="slds-form-element__label slds-m-top_medium slds-m-bottom_x-small">Reminders</div>
                            <div class="reminder-options-grid">
                                <div class="reminder-options-column">
                                    <template for:each={t.reminderOptionColumnLeft} for:item="option">
                                        <lightning-input
                                            key={option.value}
                                            data-id={t._id}
                                            type="checkbox"
                                            label={option.label}
                                            checked={option.checked}
                                            data-value={option.value}
                                            onchange={handleReminderOptionToggle}>
                                        </lightning-input>
                                    </template>
                                </div>
                                <div class="reminder-options-column">
                                    <template for:each={t.reminderOptionColumnRight} for:item="option">
                                        <lightning-input
                                            key={option.value}
                                            data-id={t._id}
                                            type="checkbox"
                                            label={option.label}
                                            checked={option.checked}
                                            data-value={option.value}
                                            onchange={handleReminderOptionToggle}>
                                        </lightning-input>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- Related To -->
                        <lightning-input
                            class="slds-m-top_medium"
                            label="Related To"
                            value={recordName}
                            disabled>
                        </lightning-input>
                    </div>
                </template>
            </div>
        </div>
        </template>

        <template if:false={isEditMode}>
            <button type="button" class="add-task-row-btn" onclick={addTaskRow}>+ Add Another Task</button>
        </template>
        </template>

        <template if:true={isUseTemplateTab}>
            <p class="template-tab-subtitle">Automatically creates a set of tasks for this Matter - each one activates and gets assigned as soon as the step(s) it depends on are completed.</p>

            <div class="template-section">
                <button type="button" class="template-section-toggle" onclick={togglePrebuiltSection} aria-expanded={isPrebuiltSectionOpen}>
                    <lightning-icon icon-name={prebuiltSectionIcon} size="xx-small"></lightning-icon>
                    <span>Pre-Built Templates</span>
                </button>

                <template if:true={isPrebuiltSectionOpen}>
                    <template if:true={isTemplatesLoading}>
                        <lightning-spinner alternative-text="Loading templates" size="small"></lightning-spinner>
                    </template>

                    <template if:true={hasTemplatesError}>
                        <p class="template-error">{templatesErrorMessage}</p>
                    </template>

                    <template if:true={hasNoTemplates}>
                        <p class="template-empty">No templates are available yet.</p>
                    </template>

                    <div class="template-card-grid">
                        <template for:each={templateCards} for:item="tpl">
                            <button
                                key={tpl.id}
                                type="button"
                                class={tpl.cardClass}
                                data-id={tpl.id}
                                aria-pressed={tpl.pressed}
                                onclick={handleTemplateCardClick}>
                                <lightning-icon icon-name={tpl.icon} size="small" class="template-card-icon"></lightning-icon>
                                <div class="template-card-text">
                                    <span class="template-card-name">{tpl.name}</span>
                                    <span class="template-card-steps">{tpl.stepLabel}</span>
                                </div>
                            </button>
                        </template>
                    </div>
                </template>

                <template if:true={showPrebuiltPreview}>
                    <div class="slds-form-element__label slds-m-top_medium slds-m-bottom_x-small">Preview</div>

                    <template if:true={isTemplateItemsLoading}>
                        <lightning-spinner alternative-text="Loading template steps" size="small" class="slds-m-top_medium"></lightning-spinner>
                    </template>

                    <template if:true={hasTemplateItemsError}>
                        <p class="template-error slds-m-top_medium">{templateItemsErrorMessage}</p>
                    </template>

                    <template if:true={templatePreviewSummary}>
                        <p class="template-preview-summary slds-m-top_medium">{templatePreviewSummary}</p>
                    </template>

                    <div class="template-timeline slds-m-top_medium">
                        <template for:each={templateItemRows} for:item="item">
                            <div key={item.id} class="timeline-step">
                                <div class="timeline-marker">
                                    <span class="timeline-circle">{item.displayIndex}</span>
                                </div>
                                <div class="timeline-content">
                                    <div class="timeline-subject">{item.subject}</div>
                                    <template if:true={item.description}>
                                        <div class="timeline-description">{item.description}</div>
                                    </template>
                                    <div class="timeline-pills">
                                        <span class={item.timingPillClass}>{item.timingLabel}</span>
                                        <span class={item.assigneePillClass}>{item.assigneeText}</span>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>

            <template if:true={isAdmin}>
            <div class="template-section slds-m-top_medium">
                <button type="button" class="template-section-toggle" onclick={toggleMyTemplatesSection} aria-expanded={isMyTemplatesSectionOpen}>
                    <lightning-icon icon-name={myTemplatesSectionIcon} size="xx-small"></lightning-icon>
                    <span>My Templates</span>
                </button>

                <template if:true={isMyTemplatesSectionOpen}>
                    <template if:false={isBuildingCustomTemplate}>
                        <template if:true={isMyTemplatesLoading}>
                            <lightning-spinner alternative-text="Loading your templates" size="small"></lightning-spinner>
                        </template>

                        <template if:true={hasMyTemplatesError}>
                            <p class="template-error">{myTemplatesErrorMessage}</p>
                        </template>

                        <template if:true={hasNoMyTemplates}>
                            <p class="template-empty">You haven't built any templates yet.</p>
                        </template>

                        <div class="template-card-grid">
                            <template for:each={myTemplateCards} for:item="tpl">
                                <div
                                    key={tpl.id}
                                    class={tpl.cardClass}
                                    data-id={tpl.id}
                                    role="button"
                                    tabindex="0"
                                    aria-pressed={tpl.pressed}
                                    onclick={handleTemplateCardClick}>
                                    <lightning-icon icon-name={tpl.icon} size="small" class="template-card-icon"></lightning-icon>
                                    <div class="template-card-text">
                                        <span class="template-card-name">{tpl.name}</span>
                                        <span class="template-card-steps">{tpl.stepLabel}</span>
                                    </div>
                                    <button
                                        type="button"
                                        class="template-card-delete"
                                        data-id={tpl.id}
                                        title="Delete this template"
                                        onclick={handleDeleteCustomTemplate}>✕</button>
                                </div>
                            </template>
                        </div>

                        <button type="button" class="add-task-row-btn slds-m-top_small" onclick={startBuildingCustomTemplate}>+ Create a Template</button>

                        <template if:true={showMyTemplatesPreview}>
                            <div class="slds-form-element__label slds-m-top_medium slds-m-bottom_x-small">Preview</div>

                            <template if:true={isTemplateItemsLoading}>
                                <lightning-spinner alternative-text="Loading template steps" size="small" class="slds-m-top_medium"></lightning-spinner>
                            </template>

                            <template if:true={hasTemplateItemsError}>
                                <p class="template-error slds-m-top_medium">{templateItemsErrorMessage}</p>
                            </template>

                            <template if:true={templatePreviewSummary}>
                                <p class="template-preview-summary slds-m-top_medium">{templatePreviewSummary}</p>
                            </template>

                            <div class="template-timeline slds-m-top_medium">
                                <template for:each={templateItemRows} for:item="item">
                                    <div key={item.id} class="timeline-step">
                                        <div class="timeline-marker">
                                            <span class="timeline-circle">{item.displayIndex}</span>
                                        </div>
                                        <div class="timeline-content">
                                            <div class="timeline-subject">{item.subject}</div>
                                            <template if:true={item.description}>
                                                <div class="timeline-description">{item.description}</div>
                                            </template>
                                            <div class="timeline-pills">
                                                <span class={item.timingPillClass}>{item.timingLabel}</span>
                                                <span class={item.assigneePillClass}>{item.assigneeText}</span>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </template>

                    <template if:true={isBuildingCustomTemplate}>
                        <lightning-input
                            label="Template Name"
                            required
                            value={customTemplateName}
                            onchange={handleCustomTemplateNameChange}>
                        </lightning-input>

                        <div class="template-timeline slds-m-top_medium">
                        <template for:each={displayCustomTemplateSteps} for:item="s">
                        <div key={s._id} class="timeline-step">
                            <div class="timeline-marker">
                                <span class="timeline-circle">{s.displayIndex}</span>
                                <template if:false={s.isLast}>
                                    <span class="timeline-line"></span>
                                </template>
                            </div>
                            <div class="timeline-content">
                                <div class="timeline-step-header">
                                    <lightning-input
                                        data-id={s._id}
                                        class="timeline-subject-input"
                                        label="Subject"
                                        variant="label-hidden"
                                        placeholder="Step subject…"
                                        required
                                        autocomplete="off"
                                        value={s.subject}
                                        onchange={handleStepSubjectChange}
                                        onkeyup={handleStepSubjectChange}>
                                    </lightning-input>
                                    <template if:true={s.canRemove}>
                                        <button
                                            type="button"
                                            class="task-draft-remove"
                                            data-id={s._id}
                                            title="Remove this step"
                                            onclick={removeStepRow}>✕</button>
                                    </template>
                                </div>

                                <div class="timeline-pills">
                                    <span class={s.timingPillClass}>{s.timingLabel}</span>
                                    <span class={s.assigneePillClass}>{s.assigneeDisplayText}</span>
                                </div>

                                <div class="slds-m-top_small">
                                    <lightning-combobox
                                        data-id={s._id}
                                        label="Assign To"
                                        variant="label-hidden"
                                        required
                                        value={s.assigneeMode}
                                        options={templateRoleOptions}
                                        onchange={handleStepAssigneeModeChange}>
                                    </lightning-combobox>

                                    <template if:true={s.isPersonMode}>
                                        <template if:true={s.hasSelectedAssignee}>
                                            <lightning-pill
                                                class="slds-m-top_x-small"
                                                label={s.selectedUser.name}
                                                data-row-id={s._id}
                                                onremove={removeStepAssignee}>
                                            </lightning-pill>
                                        </template>

                                        <template if:false={s.hasSelectedAssignee}>
                                            <div class="search-container slds-m-top_x-small" data-id={s.assigneeContainerId} onclick={handleSearchAreaClick}>
                                                <lightning-input
                                                    data-id={s._id}
                                                    type="search"
                                                    label="Assignee"
                                                    variant="label-hidden"
                                                    placeholder="Search for a person…"
                                                    required
                                                    value={s.userSearchKeyword}
                                                    onfocus={handleStepAssigneeFocus}
                                                    onblur={handleStepAssigneeBlur}
                                                    onkeyup={handleStepAssigneeSearch}
                                                    onkeydown={handleStepAssigneeKeydown}>
                                                </lightning-input>
                                            </div>
                                        </template>
                                    </template>
                                </div>
                            </div>
                        </div>
                        </template>
                        </div>

                        <button type="button" class="add-task-row-btn slds-m-top_small" onclick={addStepRow}>+ Add Step</button>

                        <div class="slds-m-top_small">
                            <lightning-button label="Cancel" onclick={cancelBuildingCustomTemplate}></lightning-button>
                            <lightning-button
                                variant="brand"
                                label="Save Template"
                                disabled={isSaveTemplateDisabled}
                                onclick={saveCustomTemplate}>
                            </lightning-button>
                        </div>
                    </template>
                </template>
            </div>
            </template>

            <template if:true={isApplyingTemplate}>
                <div class="slds-m-top_medium">
                    <lightning-spinner alternative-text="Applying template" size="small"></lightning-spinner>
                </div>
            </template>
        </template>

    </lightning-modal-body>

    <lightning-modal-footer onclick={handleModalOutsideSearchClick}>
        <lightning-button
            label="Cancel"
            onclick={handleCancel}>
        </lightning-button>

        <template if:true={isNewTaskTab}>
            <lightning-button
                variant="brand"
                label={saveLabel}
                disabled={isSaveDisabled}
                onclick={saveAll}>
            </lightning-button>
        </template>

        <template if:true={isUseTemplateTab}>
            <lightning-button
                variant="brand"
                label="Create Tasks"
                disabled={isApplyTemplateDisabled}
                onclick={applyTemplate}>
            </lightning-button>
        </template>
    </lightning-modal-footer>

    <!--
        Search dropdowns (Subject/Assignee/Waiting On/step-assignee) render
        into this single node, which JS moves to document.body - the same
        technique Salesforce's own base components (e.g. the Due Date
        picker above) use to escape lightning-modal-body's clipping.
        lwc:dom="manual" tells LWC not to manage its children; we build/
        tear them down by hand in JS instead of through this template.
    -->
