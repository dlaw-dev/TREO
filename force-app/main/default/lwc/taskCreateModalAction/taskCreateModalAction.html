<template>
    <lightning-modal-header label="New Task"></lightning-modal-header>

    <lightning-modal-body onclick={handleModalOutsideSearchClick}>

        <div class="modal-tabs" role="tablist">
            <button
                type="button"
                role="tab"
                aria-selected={isNewTaskTab}
                class={newTaskTabClass}
                data-tab="newTask"
                onclick={handleTabClick}>New Task</button>
            <button
                type="button"
                role="tab"
                aria-selected={isUseTemplateTab}
                class={useTemplateTabClass}
                data-tab="useTemplate"
                onclick={handleTabClick}>Use Task Template</button>
        </div>

        <template if:true={isNewTaskTab}>
        <template for:each={displayTasks} for:item="t">
        <div key={t._id} class="task-draft-card">
            <div class="task-draft-header">
                <span class="task-draft-index">Task {t.displayIndex}</span>
                <template if:true={t.canRemove}>
                    <button
                        type="button"
                        class="task-draft-remove"
                        data-id={t._id}
                        title="Remove this task"
                        onclick={removeTaskRow}>✕</button>
                </template>
            </div>

            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-3">
                    <!-- Subject -->
                    <div class="search-container" data-id={t.subjectContainerId} onclick={handleSearchAreaClick}>
                        <lightning-input
                            data-id={t._id}
                            data-role="subject-input"
                            label="Subject"
                            required
                            autocomplete="off"
                            value={t.subject}
                            onfocus={handleSubjectFocus}
                            onblur={handleSubjectBlur}
                            onchange={handleSubject}
                            onkeyup={handleSubject}>
                        </lightning-input>

                        <template if:true={t.hasSubjectSuggestions}>
                            <div class="search-dropdown" style={t.subjectDropdownStyle} onmousedown={handleSubjectDropdownMouseDown}>
                                <template for:each={t.filteredSubjectSuggestions} for:item="s">
                                    <button
                                        key={s}
                                        type="button"
                                        class="dropdown-item"
                                        data-value={s}
                                        onclick={selectSubjectSuggestion}>
                                        {s}
                                    </button>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-3">
                    <!-- Selected Assignee -->
                    <template if:true={t.hasSelectedAssignee}>
                        <div class="slds-form-element__label slds-m-bottom_x-small">
                            Assignee <abbr class="slds-required" title="required">*</abbr>
                        </div>

                        <template for:each={t.selectedUsers} for:item="u">
                            <lightning-pill
                                key={u.id}
                                label={u.name}
                                data-row-id={t._id}
                                onremove={removeUser}>
                            </lightning-pill>
                        </template>
                    </template>

                    <!-- Assignee Search -->
                    <template if:false={t.hasSelectedAssignee}>
                        <div class="search-container" data-id={t.assigneeContainerId} onclick={handleSearchAreaClick}>
                            <lightning-input
                                data-id={t._id}
                                type="search"
                                label="Assignee"
                                required
                                value={t.userSearchKeyword}
                                onfocus={handleUserFocus}
                                onclick={handleUserClick}
                                onblur={handleUserBlur}
                                onkeyup={handleUserSearch}
                                onkeydown={handleUserKeydown}>
                            </lightning-input>

                            <template if:true={t.hasUserResults}>
                                <div class="search-dropdown" style={t.assigneeDropdownStyle} onmousedown={handleSearchDropdownMouseDown}>
                                    <template for:each={t.userResults} for:item="u">
                                        <button
                                            key={u.Id}
                                            type="button"
                                            class="dropdown-item"
                                            data-id={u.Id}
                                            onclick={addUser}>
                                            {u.Name}
                                        </button>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>

                <div class="slds-col slds-size_1-of-3">
                    <!-- Due Date -->
                    <lightning-input
                        data-id={t._id}
                        data-role="dueDate"
                        type="date"
                        label="Due Date"
                        required
                        message-when-value-missing="Please select a Due Date."
                        value={t.activityDate}
                        onchange={handleDueDate}>
                    </lightning-input>
                </div>
            </div>

            <!-- More Details -->
            <div class="more-details-section slds-m-top_medium">
                <button
                    type="button"
                    class="more-details-toggle"
                    data-id={t._id}
                    onclick={toggleMoreDetails}
                    aria-expanded={t.isMoreDetailsOpen}>
                    <lightning-icon icon-name={t.moreDetailsIcon} size="xx-small"></lightning-icon>
                    <span>More Details</span>
                </button>

                <template if:true={t.isMoreDetailsOpen}>
                    <div class="more-details-content slds-m-top_small">

                        <!-- Description -->
                        <lightning-textarea
                            data-id={t._id}
                            label="Description"
                            value={t.description}
                            onchange={handleDescription}>
                        </lightning-textarea>

                        <!-- Priority -->
                        <lightning-combobox
                            class="slds-m-top_medium"
                            data-id={t._id}
                            label="Priority"
                            value={t.priority}
                            options={priorityOptions}
                            onchange={handlePriority}>
                        </lightning-combobox>

                        <!-- Status -->
                        <lightning-combobox
                            class="slds-m-top_medium"
                            data-id={t._id}
                            label="Status"
                            value={t.status}
                            options={statusOptions}
                            onchange={handleStatus}>
                        </lightning-combobox>

                        <!-- Waiting On Task -->
                        <template if:true={t.isStatusWaiting}>
                            <div class="slds-m-top_medium">
                                <template if:true={t.hasWaitingOnTask}>
                                    <div class="slds-form-element__label slds-m-bottom_x-small">Waiting On</div>
                                    <div class="waiting-on-pill">
                                        <span class="waiting-on-pill-label">{t.waitingOnTaskLabel}</span>
                                        <button
                                            type="button"
                                            class="waiting-on-pill-remove"
                                            data-id={t._id}
                                            title="Clear"
                                            onclick={clearWaitingOnTask}>✕</button>
                                    </div>
                                </template>

                                <template if:false={t.hasWaitingOnTask}>
                                    <div class="search-container" data-id={t.waitingContainerId} onclick={handleSearchAreaClick}>
                                        <lightning-input
                                            data-id={t._id}
                                            type="search"
                                            label="Waiting On"
                                            required
                                            placeholder="Search tasks on this Matter…"
                                            value={t.waitingSearchKeyword}
                                            onfocus={handleWaitingFocus}
                                            onblur={handleWaitingBlur}
                                            onkeyup={handleWaitingSearch}
                                            onkeydown={handleWaitingKeydown}>
                                        </lightning-input>

                                        <template if:true={t.hasWaitingResults}>
                                            <div class="search-dropdown" style={t.waitingDropdownStyle} onmousedown={handleWaitingDropdownMouseDown}>
                                                <template for:each={t.waitingResults} for:item="wt">
                                                    <button
                                                        key={wt.Id}
                                                        type="button"
                                                        class="dropdown-item dropdown-item--task"
                                                        data-id={wt.Id}
                                                        onclick={selectWaitingOnTask}>
                                                        <span class="dropdown-item-title">{wt.Subject}</span>
                                                        <span class="dropdown-item-meta">{wt.metaLabel}</span>
                                                    </button>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- Reminder Set -->
                        <lightning-input
                            class="slds-m-top_medium"
                            data-id={t._id}
                            type="checkbox"
                            label="Reminder Set"
                            checked={t.isReminderSet}
                            disabled={t.isReminderDisabled}
                            onchange={handleReminderSet}>
                        </lightning-input>

                        <!-- Reminder Picker -->
                        <template if:true={t.isReminderSet}>
                            <div class="slds-form-element__label slds-m-top_medium slds-m-bottom_x-small">Reminders</div>
                            <div class="reminder-options-grid">
                                <div class="reminder-options-column">
                                    <template for:each={t.reminderOptionColumnLeft} for:item="option">
                                        <lightning-input
                                            key={option.value}
                                            data-id={t._id}
                                            type="checkbox"
                                            label={option.label}
                                            checked={option.checked}
                                            data-value={option.value}
                                            onchange={handleReminderOptionToggle}>
                                        </lightning-input>
                                    </template>
                                </div>
                                <div class="reminder-options-column">
                                    <template for:each={t.reminderOptionColumnRight} for:item="option">
                                        <lightning-input
                                            key={option.value}
                                            data-id={t._id}
                                            type="checkbox"
                                            label={option.label}
                                            checked={option.checked}
                                            data-value={option.value}
                                            onchange={handleReminderOptionToggle}>
                                        </lightning-input>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- Related To -->
                        <lightning-input
                            class="slds-m-top_medium"
                            label="Related To"
                            value={recordName}
                            disabled>
                        </lightning-input>
                    </div>
                </template>
            </div>
        </div>
        </template>

        <button type="button" class="add-task-row-btn" onclick={addTaskRow}>+ Add Another Task</button>
        </template>

        <template if:true={isUseTemplateTab}>
            <p class="template-tab-subtitle">Automatically creates a sequence of tasks for this Matter - each one activates and gets assigned as soon as the step before it is completed.</p>

            <div class="slds-form-element__label slds-m-bottom_x-small">Choose a template</div>

            <template if:true={isTemplatesLoading}>
                <lightning-spinner alternative-text="Loading templates" size="small"></lightning-spinner>
            </template>

            <template if:true={hasTemplatesError}>
                <p class="template-error">{templatesErrorMessage}</p>
            </template>

            <template if:true={hasNoTemplates}>
                <p class="template-empty">No templates are available yet.</p>
            </template>

            <div class="template-card-grid">
                <template for:each={templateCards} for:item="tpl">
                    <button
                        key={tpl.id}
                        type="button"
                        class={tpl.cardClass}
                        data-id={tpl.id}
                        aria-pressed={tpl.pressed}
                        onclick={handleTemplateCardClick}>
                        <lightning-icon icon-name={tpl.icon} size="small" class="template-card-icon"></lightning-icon>
                        <div class="template-card-text">
                            <span class="template-card-name">{tpl.name}</span>
                            <span class="template-card-steps">{tpl.stepLabel}</span>
                        </div>
                    </button>
                </template>
            </div>

            <template if:true={hasSelectedTemplate}>
                <template if:true={isTemplateItemsLoading}>
                    <lightning-spinner alternative-text="Loading template steps" size="small" class="slds-m-top_medium"></lightning-spinner>
                </template>

                <template if:true={hasTemplateItemsError}>
                    <p class="template-error slds-m-top_medium">{templateItemsErrorMessage}</p>
                </template>

                <template if:true={templatePreviewSummary}>
                    <p class="template-preview-summary slds-m-top_medium">{templatePreviewSummary}</p>
                </template>

                <div class="template-timeline slds-m-top_medium">
                    <template for:each={templateItemRows} for:item="item">
                        <div key={item.id} class="timeline-step">
                            <div class="timeline-marker">
                                <span class="timeline-circle">{item.displayIndex}</span>
                                <template if:false={item.isLast}>
                                    <span class="timeline-line"></span>
                                </template>
                            </div>
                            <div class="timeline-content">
                                <div class="timeline-subject">{item.subject}</div>
                                <template if:true={item.description}>
                                    <div class="timeline-description">{item.description}</div>
                                </template>
                                <div class="timeline-pills">
                                    <span class={item.timingPillClass}>{item.timingLabel}</span>
                                    <span class={item.assigneePillClass}>{item.assigneeText}</span>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <template if:true={isApplyingTemplate}>
                <div class="slds-m-top_medium">
                    <lightning-spinner alternative-text="Applying template" size="small"></lightning-spinner>
                </div>
            </template>
        </template>

    </lightning-modal-body>

    <lightning-modal-footer onclick={handleModalOutsideSearchClick}>
        <lightning-button
            label="Cancel"
            onclick={handleCancel}>
        </lightning-button>

        <template if:true={isNewTaskTab}>
            <lightning-button
                variant="brand"
                label={saveLabel}
                disabled={isSaveDisabled}
                onclick={saveAll}>
            </lightning-button>
        </template>

        <template if:true={isUseTemplateTab}>
            <lightning-button
                variant="brand"
                label="Create Tasks"
                disabled={isApplyTemplateDisabled}
                onclick={applyTemplate}>
            </lightning-button>
        </template>
    </lightning-modal-footer>
</template>
