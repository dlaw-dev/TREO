<template>
  <div class="tt-popout">
    <header class="tt-popout-header">
      <lightning-icon icon-name="utility:clock" size="small"></lightning-icon>
      <span class="tt-popout-title">Time Tracker</span>
    </header>

    <template if:true={active}>
      <p class="tt-popout-matter">{matterName}</p>
      <p class="tt-popout-elapsed">{elapsedLabel}</p>

      <div class="slds-button-group tt-popout-controls" role="group">
        <lightning-button label="Pause" onclick={handlePause} disabled={pauseDisabled}></lightning-button>
        <lightning-button label="Resume" onclick={handleResume} disabled={resumeDisabled}></lightning-button>
        <lightning-button variant="destructive" label="Stop" onclick={handleStop} disabled={stopDisabled}></lightning-button>
      </div>
    </template>

    <template if:false={active}>
      <p class="tt-popout-empty">No active timer. Restart one below, or start it from the Matter record.</p>
    </template>

    <template if:true={hasHistory}>
      <c-timer-history-list groups={historyGroups} onrestart={handleRestart}></c-timer-history-list>
    </template>
  </div>
</template>
