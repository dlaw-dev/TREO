<template>
  <div class="task-tooltip-portal" role="tooltip" lwc:dom="manual"></div>
  <div class="panel panel--tasks">
    <div class="panel-header tasks-panel-header">
      <span class="tc-title">
        {tasksHeader}
        <button type="button" class="tc-refresh-btn" onclick={handleRefresh}
                title="Refresh task list" aria-label="Refresh task list" disabled={isRefreshing}>{refreshBtnLabel}</button>
      </span>
      <div class="tc-header-right">
        <button type="button" class="tc-new-task-btn" onclick={handleNewTask}>+ Task</button>
        <div class="task-filter-bar task-filter-bar--view">
          <button type="button" class={showOpenClass} onclick={handleToggleShowCompleted}>Open</button>
          <button type="button" class={showAllClass}  onclick={handleToggleShowCompleted}>All</button>
        </div>
        <div class="task-filter-bar">
          <button type="button" class={taskFilterWeekClass} data-filter="week"  onclick={handleTaskFilter}>Week</button>
          <button type="button" class={taskFilter1MClass}   data-filter="month" onclick={handleTaskFilter}>1 Mo</button>
          <button type="button" class={taskFilter3MClass}   data-filter="90"    onclick={handleTaskFilter}>3 Mo</button>
          <button type="button" class={taskFilter6MClass}   data-filter="180"   onclick={handleTaskFilter}>6 Mo</button>
          <button type="button" class={taskFilter9MClass}   data-filter="270"   onclick={handleTaskFilter}>9 Mo</button>
          <button type="button" class={taskFilter12MClass}  data-filter="360"   onclick={handleTaskFilter}>12 Mo</button>
        </div>
      </div>
    </div>

    <div class="type-filter-row">
      <input type="search" class="task-search-input" placeholder="Search tasks…" oninput={handleSearch}>
      <select class="type-filter-select" onchange={handlePriorityFilter}>
        <option value="">All Priorities</option>
        <template for:each={priorityFilters} for:item="pf">
          <option key={pf.key} value={pf.key}>{pf.label}</option>
        </template>
      </select>
    </div>

    <template if:true={isLoading}>
      <lightning-spinner alternative-text="Loading tasks" size="medium"></lightning-spinner>
    </template>
    <template if:true={hasError}>
      <p class="tasks-error">{errorMessage}</p>
    </template>
    <template if:false={isLoading}>
      <template if:false={hasError}>
        <template if:true={hasTasks}>
          <div class="tasks-table-wrap">
            <table class="tasks-table">
              <thead>
                <tr>
                  <th class="tasks-th tasks-th--sortable" data-field="Subject" onclick={handleSort} onkeydown={handleSortKeydown} role="button" tabindex="0" aria-sort={subjectAriaSort}>Subject{subjectSortIcon}</th>
                  <th class="tasks-th tasks-th--sortable" data-field="Priority" onclick={handleSort} onkeydown={handleSortKeydown} role="button" tabindex="0" aria-sort={priorityAriaSort}>Priority{prioritySortIcon}</th>
                  <th class="tasks-th tasks-th--sortable" data-field="ActivityDate" onclick={handleSort} onkeydown={handleSortKeydown} role="button" tabindex="0" aria-sort={dueAriaSort}>Due{dueSortIcon}</th>
                  <th class="tasks-th tasks-th--sortable" data-field="OwnerName" onclick={handleSort} onkeydown={handleSortKeydown} role="button" tabindex="0" aria-sort={assigneeAriaSort}>Assignee{assigneeSortIcon}</th>
                  <th class="tasks-th tasks-th--action"></th>
                </tr>
              </thead>
              <tbody>
                <template for:each={displayTasks} for:item="t">
                  <tr key={t.Id} class={t.rowClass}>
                    <td class="tasks-td">
                      <button type="button" class="tasks-subject-link" data-id={t.Id} onclick={handleSubjectClick}>{t.Subject}</button>
                      <template if:true={t.hasAttachments}>
                        <button type="button" class="attachment-clip-btn" data-id={t.Id} onclick={handleAttachmentClick} title={t.attachmentTitle}>📎</button>
                        <template if:true={t.isAttachmentMenuOpen}>
                          <ul class="attachment-menu">
                            <template for:each={t.attachments} for:item="a">
                              <li key={a.contentDocumentId}>
                                <a href={a.viewUrl} target="_blank" rel="noopener">{a.title}</a>
                              </li>
                            </template>
                          </ul>
                        </template>
                      </template>
                      <template if:true={t.hasComments}>
                        <span
                          class="task-detail-wrapper"
                          tabindex="0"
                          data-tooltip={t.commentsTitle}
                          onmouseenter={handleCommentsEnter}
                          onmouseleave={handleCommentsLeave}
                          onfocusin={handleCommentsEnter}
                          onfocusout={handleCommentsLeave}
                        >
                          <lightning-icon
                            icon-name="utility:paste"
                            alternative-text="View task details"
                            size="xx-small"
                            class="task-detail-icon">
                          </lightning-icon>
                        </span>
                      </template>
                    </td>
                    <td class="tasks-td">{t.Priority}</td>
                    <td class="tasks-td tasks-td--date">
                      <span class={t.dueBadgeClass}>{t.dueLabel}</span>
                    </td>
                    <td class="tasks-td">{t.OwnerName}</td>
                    <td class="tasks-td tasks-td--action">
                      <template if:true={t.isBypassed}>
                        <span class="task-skipped-pill">⏭ Skipped</span>
                      </template>
                      <template if:false={t.isBypassed}>
                        <template if:true={t.isCompleted}>
                          <span class="task-done-pill">✓ Done</span>
                        </template>
                      </template>
                      <template if:true={t.isWaiting}>
                        <span class="task-waiting-pill" title={t.waitingTitle}>⏳ Waiting</span>
                      </template>
                      <template if:true={t.isPendingReview}>
                        <span class="task-review-pill" title={t.reviewFeedbackTitle}>🔍 Pending Review</span>
                      </template>
                      <template if:true={t.showMarkDone}>
                        <button type="button" class="task-done-btn" data-id={t.Id} onclick={handleTaskCompleteBtn} disabled={t.disableMarkDone} title={t.markDoneTitle}>{t.markDoneLabel}</button>
                      </template>
                      <template if:true={t.showSkip}>
                        <button type="button" class="task-skip-btn" data-id={t.Id} onclick={handleBypass} disabled={t.disableSkip} title="Skip this step without completing it">Skip</button>
                      </template>
                      <template if:true={t.showApprove}>
                        <button type="button" class="task-approve-btn" data-id={t.Id} onclick={handleApprove} disabled={t.disableApprove} title="Approve - marks this task complete">Approve</button>
                      </template>
                      <template if:true={t.showSendBack}>
                        <button type="button" class="task-sendback-btn" data-id={t.Id} onclick={handleSendBack} disabled={t.disableSendBack} title="Send back to the assignee">Send Back</button>
                      </template>
                      <template if:true={t.canReassign}>
                        <button type="button" class="task-reassign-btn" data-id={t.Id} onclick={handleReassign} title="Edit or reassign this task">Edit/Reassign</button>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
        <template if:false={hasTasks}>
          <div class="panel-empty">
            <span class="panel-empty__icon">✓</span>
            <span>{tasksEmptyMessage}</span>
          </div>
        </template>
      </template>
    </template>
  </div>
</template>
